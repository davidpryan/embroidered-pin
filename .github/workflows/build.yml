name: build firmware & deploy gallery
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with: { path: ~/.arduino15, key: arduino15-esp32-v1 }
      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "GFX Library for Arduino"
      - name: Compile firmware
        run: arduino-cli compile --fqbn "esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=16M,CDCOnBoot=cdc" --export-binaries firmware/pin_firmware
      - name: Assemble site
        run: |
          mkdir -p site/firmware && cp -r docs/* site/
          B=firmware/pin_firmware/build/esp32.esp32.esp32s3
          cp $B/pin_firmware.ino.bin            site/firmware/app.bin
          cp $B/pin_firmware.ino.bootloader.bin site/firmware/bootloader.bin
          cp $B/pin_firmware.ino.partitions.bin site/firmware/partitions.bin
          cp $B/pin_firmware.ino.merged.bin     site/firmware/merged.bin
          cp "$(find ~/.arduino15 -name boot_app0.bin | head -1)" site/firmware/boot_app0.bin
          ls -la site/firmware
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
